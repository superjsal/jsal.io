# Publishes site/ to GitHub Pages (jsal.io) after every push to main. The repository's root is the project folder
# (rules, scripts, docs); only site/ is what the world sees. The nightly publish pushes with the workflow token,
# which starts no other workflow, so it runs this one itself with `gh workflow run deploy-pages.yml`.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

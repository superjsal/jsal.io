# The fallback copy of jsal.io on GitHub Pages, kept until 2026-11-09 in case Cloudflare needs to be bypassed (DNS
# pointed back at GitHub): after every push to main it builds the site with Astro, as Cloudflare does, and publishes
# dist/ (site/CNAME, copied into it, keeps the custom domain). The nightly publish pushes with the workflow token,
# which starts no other workflow, so it runs this one itself with `gh workflow run deploy-pages.yml`.
# Retire it on or after 2026-11-09: delete this file, site/CNAME and that step, then unpublish Pages in the settings.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

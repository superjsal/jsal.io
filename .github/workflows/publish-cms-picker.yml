# Publishes the CMS Picker from Supabase every night: Playbook answers (with admin edits) plus the
# admin-only picker table, written to cms-picker/data.json, with the date of each CMS Picker page whose
# data changed (src/data/cms-picker-dates.json) and sitemap.xml. Cloudflare's build makes the pages from them.
# Commits only when something changed; Cloudflare deploys the push on its own, and once it's live this tells
# IndexNow (Bing and others) which pages changed.
#
# Needs one repository secret: Settings → Secrets and variables → Actions → New repository secret,
# name SUPABASE_SERVICE_ROLE_KEY, value the Supabase secret key (the same one you set in your terminal).
name: Publish CMS Picker

on:
  schedule:
    - cron: "41 7 * * *"     # every day, 07:41 UTC
  workflow_dispatch:          # "Run workflow" button to publish now

permissions:
  contents: write             # commit the published files
  actions: write              # start the GitHub Pages deploy, kept as a fallback for now
  checks: read                # watch Cloudflare's build of that commit

concurrency:
  group: publish-cms-picker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Publish from Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python .github/scripts/playbook.py publish
      - name: Commit if anything changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "No changes to publish."; exit 0; fi
          git config user.name "superjsal"
          git config user.email "dev@jsal.io"
          git add -A site/cms-picker/data.json site/cms-picker/logos src/data/cms-picker-dates.json site/sitemap.xml
          git commit -m "CMS Picker: nightly publish from Playbook"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The GitHub Pages copy stays current while it's the fallback. A push made with the workflow's own token
      # starts no other workflow, so its deploy is started here.
      - name: Deploy Pages (fallback)
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
      # Tell Bing and the other IndexNow engines which pages changed, once Cloudflare's build of the commit is
      # live (up to ~5 minutes; Cloudflare reports it as a check on the commit)
      - name: Announce changed pages (IndexNow)
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          for i in $(seq 1 90); do
            s=$(gh api "repos/${{ github.repository }}/commits/${{ steps.commit.outputs.sha }}/check-runs" --jq '[.check_runs[] | select((.app.slug | test("cloudflare")) and (.details_url | test("/production/builds/")))][0] | "\(.status) \(.conclusion)"' 2>/dev/null)
            [ "$s" = "completed success" ] && break
            case "$s" in completed*) echo "Cloudflare's production build ended as: $s. Nothing announced."; exit 0;; esac
            sleep 10
          done
          # Announce only once the pages are live, never after a failed or unfinished build
          if [ "$s" != "completed success" ]; then echo "Cloudflare's production build didn't finish in time. Nothing announced."; exit 0; fi
          python .github/scripts/indexnow.py changed

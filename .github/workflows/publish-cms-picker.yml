# Publishes the CMS Picker from Supabase every night: Playbook answers (with admin edits) plus the
# admin-only picker table, written to cms-picker/data.json, the plain-HTML copy in the page and one
# page per platform (cms-picker/<platform>/index.html, listed in sitemap.xml).
# Commits only when something changed, then asks GitHub Pages to rebuild and, once it's live, tells
# IndexNow (Bing and others) which pages changed.
#
# Needs one repository secret: Settings → Secrets and variables → Actions → New repository secret,
# name SUPABASE_SERVICE_ROLE_KEY, value the Supabase secret key (the same one you set in your terminal).
name: Publish CMS Picker

on:
  schedule:
    - cron: "41 7 * * *"     # every day, 07:41 UTC
  workflow_dispatch:          # "Run workflow" button to publish now

permissions:
  contents: write             # commit the published files
  pages: write                # ask Pages to rebuild after that commit

concurrency:
  group: publish-cms-picker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Publish from Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python .github/scripts/playbook.py publish
      - name: Commit if anything changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "No changes to publish."; exit 0; fi
          git config user.name "superjsal"
          git config user.email "dev@jsal.io"
          git add -A cms-picker/data.json cms-picker/index.html cms-picker/logos 'cms-picker/*/index.html' sitemap.xml
          git commit -m "CMS Picker: nightly publish from Playbook"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # Pushes made with the workflow's own token don't start the Pages build by themselves
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
      # Tell Bing and the other IndexNow engines which pages changed, once the new build is live (up to ~5 minutes)
      - name: Announce changed pages (IndexNow)
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            s=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq .status)
            [ "$s" = "built" ] && break
            sleep 10
          done
          python .github/scripts/indexnow.py changed

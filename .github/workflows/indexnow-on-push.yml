# After a push to main by hand, tells Bing and the other IndexNow engines which pages changed, once Cloudflare's
# build is live, so nobody has to remember to run indexnow.py. It builds the site before and after the push and sends
# every page whose built HTML differs, so a change to a page, the layout, the data or the changelog all count; only
# addresses in sitemap.xml are sent (indexnow.py keeps to those). The nightly publish announces its own pages, so its
# commits are skipped here. A push can't tell a text change from a code change, so any changed page is sent: a wasted
# ping costs nothing.
name: IndexNow for changed pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  checks: read                # watch Cloudflare's build of this push

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  announce:
    if: "${{ !startsWith(github.event.head_commit.message, 'CMS Picker: nightly publish') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build the site after and before this push
        run: |
          before="${{ github.event.before }}"
          git cat-file -e "$before" 2>/dev/null || before="${{ github.sha }}~1"
          npm ci && npm run build && mv dist "$RUNNER_TEMP/after"
          git worktree add -q "$RUNNER_TEMP/src-before" "$before"
          cd "$RUNNER_TEMP/src-before"
          # A commit from before the site had a build served site/ as it was
          if [ -f package.json ]; then npm ci && npm run build && mv dist "$RUNNER_TEMP/before"; else cp -r site "$RUNNER_TEMP/before"; fi
      - name: Pages whose built HTML changed
        id: pages
        run: |
          urls=$(python .github/scripts/indexnow.py built "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" --list)
          echo "urls=$urls" >> "$GITHUB_OUTPUT"
          echo "Changed pages: ${urls:-none}"
      # A shipped commit was pushed to staging first, so it also carries the preview's build check: wait for the
      # production one (its link has /production/builds/), which Cloudflare queues after it (up to ~10 minutes)
      - name: Wait for Cloudflare's production build to be live
        if: steps.pages.outputs.urls != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 80); do
            s=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" --jq '[.check_runs[] | select((.app.slug | test("cloudflare")) and (.details_url | test("/production/builds/")))][0] | "\(.status) \(.conclusion)"' 2>/dev/null)
            [ "$s" = "completed success" ] && break
            sleep 10
          done
      - name: Announce them
        if: steps.pages.outputs.urls != ''
        continue-on-error: true
        run: python .github/scripts/indexnow.py ${{ steps.pages.outputs.urls }}

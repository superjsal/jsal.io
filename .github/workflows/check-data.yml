# Runs the site's checks after every push to main: check.py (the same pre-push checks as .github\build\check.ps1),
# the CMS Picker data against cms-picker.schema.json with a list of what isn't sourced yet, the persona tests, and
# the browser checks (axe on every page, the phone widths, each tool's main flow) on Playwright's own Chromium,
# WebKit and Firefox. A failure shows as a red X on the commit; GitHub Pages still deploys (main is the live site),
# so .github\build\check.ps1 before pushing stays the first gate and this is the one that holds from any machine.
name: Site checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Site checks (top bar, cache numbers, links, unused CSS, styling, branding, sitemap)
        run: python -I .github/build/check.py
      - name: Check the data and list what isn't sourced
        run: python .github/scripts/check_data.py --list
      - name: Persona tests (the agreed Find my fit results)
        run: node .github/scripts/personas.test.js

  browser:
    runs-on: ubuntu-latest
    # Playwright's own image for the version in .github/build/package.json: its browsers and their system
    # libraries are already there (installing them on the runner fails on Ubuntu 24.04's package names)
    container: mcr.microsoft.com/playwright:v1.48.2-jammy
    steps:
      - uses: actions/checkout@v5
      - name: Install the checks' packages
        working-directory: .github/build
        run: npm ci
      - name: Serve the site on port 8765
        run: |
          npx --yes http-server site -p 8765 -a 127.0.0.1 -s &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8765/ && break; sleep 1; done
      - name: Browser checks (axe on every page, 375/390px, each tool's main flow)
        env:
          HOME: /root   # Firefox won't start when HOME is owned by another user, which the container's default is
        run: node .github/build/browser-check.mjs

# Free Supabase projects pause after about a week without activity, which would take Platform
# Playbook offline. This calls the database's ping() function (it only returns the time) twice a
# week. The project URL and anon key (public by design; the same values ic/app.js carries) are the
# repository's Actions variables SUPABASE_URL and SUPABASE_ANON_KEY: Settings → Secrets and variables
# → Actions → Variables, or `gh variable set`. A new Supabase project means updating them.
name: Keep Platform Playbook awake

on:
  schedule:
    - cron: "17 9 * * 1,4"   # Mondays and Thursdays, 09:17 UTC
  workflow_dispatch:          # "Run workflow" button for a manual check

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          [ -n "$URL" ] && [ -n "$KEY" ] || { echo "SUPABASE_URL or SUPABASE_ANON_KEY isn't set as a repository variable"; exit 1; }
          curl --fail --silent --show-error -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
          echo

<!doctype html>
<!-- Brand kit images, rendered to PNG by make-og.ps1 into .github/brand/kit/ (not served). The window size sets the image size:
     kit.html?p=linkedin   1584 × 396   LinkedIn banner (the profile photo covers the bottom left, so the content sits right)
     kit.html?p=github     1280 × 640   GitHub repository social preview
     kit.html?p=avatar     any square   profile picture: the square mark, which round crops keep whole
     kit.html?p=icon&t=cms-picker | clean-paste | image-resizer | redirect-import | platform-playbook   any square, transparent corners
     kit.html?p=signature&theme=light | dark   the lockup for an email signature, transparent
     Everything is drawn from the files in .github/brand/, so a change there shows here on the next render. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Inter"; font-weight: 100 900; src: url(../../../site/fonts/inter.woff2) format("woff2"); }
@font-face { font-family: "Lora"; font-style: normal; font-weight: 400 700; src: url(../../../site/fonts/lora.woff2) format("woff2"); }
@font-face { font-family: "Lora"; font-style: italic; font-weight: 400 700; src: url(../../../site/fonts/lora-italic.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 100 800; src: url(../../../site/fonts/jetbrains-mono.woff2) format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { font-family: Inter, sans-serif; color: #ece6d6; background: transparent; }
img { display: block; }
.slate { background: #111318; }
.roles { font: 500 17px/1 "JetBrains Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; color: #e3b04b; display: flex; gap: 14px; }
.roles span + span::before { content: "·"; margin-right: 14px; color: #9a9688; }
h1 { font: 700 54px/1.08 Lora, Georgia, serif; letter-spacing: -0.02em; text-wrap: balance; }
h1 em { font-style: italic; font-weight: 600; color: #e3b04b; }
.tools { display: flex; gap: 26px; }
.tool { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 500; color: #cfc8b6; white-space: nowrap; }
/* LinkedIn: one column on the right two thirds */
.linkedin { display: grid; justify-content: end; align-content: center; gap: 22px; padding: 0 84px; }
.linkedin .lockup { height: 46px; width: auto; }
.linkedin .tool img { width: 40px; height: 40px; }
/* GitHub: centred */
.github { display: grid; justify-items: center; align-content: center; gap: 30px; text-align: center; }
.github .lockup { height: 88px; width: auto; }
.github h1 { font-size: 60px; max-width: 16em; }
.github .tool img { width: 48px; height: 48px; }
.fill { width: 100vw; height: 100vh; }
.sig { width: auto; height: 100vh; }
</style>
</head>
<body>
<script>
// Each layout is built from the brand folder's files; the names and words are the home page's own
const q = new URLSearchParams(location.search), p = q.get('p') || 'linkedin', B = '../../brand/';
const TOOLS = [['cms-picker', 'CMS Picker'], ['clean-paste', 'Clean Paste'], ['image-resizer', 'Image Resizer'], ['platform-playbook', 'Platform Playbook']];
const roles = '<p class="roles"><span>John Salvador</span><span>Technical SEO</span></p>';
const h1 = '<h1>Small tools that do <em>one job</em> well.</h1>';
const tools = '<div class="tools">' + TOOLS.map(([f, n]) => `<span class="tool"><img src="${B}tools/${f}.svg" alt="">${n}</span>`).join('') + '</div>';
const lockup = `<img class="lockup" src="${B}lockup-dark.svg" alt="jsal.io">`;
const html = {
  linkedin: `<main class="slate fill linkedin">${lockup}${h1}${tools}</main>`,
  github: `<main class="slate fill github">${roles}${lockup}${h1}${tools}</main>`,
  avatar: `<img class="fill" src="${B}mark-square.svg" alt="">`,
  icon: `<img class="fill" src="${B}tools/${q.get('t') || 'cms-picker'}.svg" alt="">`,
  signature: `<img class="sig" src="${B}lockup-${q.get('theme') === 'dark' ? 'dark' : 'light'}.svg" alt="jsal.io">`,
}[p];
document.body.innerHTML = html;
</script>
</body>
</html>

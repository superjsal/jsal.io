<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMS Picker has moved</title>
<!-- CMS SEO Checker was renamed CMS Picker. GitHub Pages can't send a server redirect, so this
     page does it: canonical + instant meta refresh for search engines, and the script keeps any #fragment. -->
<link rel="canonical" href="https://jsal.io/cms-picker/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=/cms-picker/">
<script>location.replace('/cms-picker/' + location.search + location.hash);</script>
</head>
<body>
<p>CMS SEO Checker is now <a href="/cms-picker/">CMS Picker</a>.</p>
</body>
</html>
